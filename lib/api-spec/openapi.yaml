openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: warriors
    description: Live warrior metadata
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /warriors/{tokenId}:
    get:
      operationId: getWarriorMetadata
      tags: [warriors]
      summary: Get live metadata for a warrior
      description: Returns current metadata derived from the owner's qualifying public portfolio data. Stale data is explicitly marked.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: Warrior metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarriorMetadata"
        "400":
          description: Invalid token ID
        "503":
          description: Data source is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /token/{tokenId}:
    get:
      operationId: getTokenMetadata
      tags: [warriors]
      summary: Get marketplace token metadata
      description: Contract-facing alias for the live warrior metadata route.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: Warrior metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarriorMetadata"
        "404":
          description: Metadata is locked before launch
        "503":
          description: Data source is unavailable or not configured
  /collection:
    get:
      operationId: getCollectionMetadata
      tags: [warriors]
      summary: Get OpenSea collection metadata
      responses:
        "200":
          description: Collection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionMetadata"
        "404":
          description: Metadata is locked before launch
        "503":
          description: Metadata is unavailable or not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    WarriorAttribute:
      type: object
      properties:
        trait_type:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
      required: [trait_type, value]
    WarriorMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
          format: uri
        external_url:
          type: string
          format: uri
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WarriorAttribute"
        properties:
          type: object
          properties:
            wallet:
              type: string
            epoch:
              type: string
            observedAt:
              type: string
              format: date-time
            stale:
              type: boolean
          required: [wallet, epoch, observedAt, stale]
      required: [name, description, image, external_url, attributes, properties]
    CollectionMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
          format: uri
        external_link:
          type: string
          format: uri
        seller_fee_basis_points:
          type: integer
          minimum: 0
        fee_recipient:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
      required: [name, description, image, external_link, seller_fee_basis_points, fee_recipient]

