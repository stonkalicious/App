kind = "web"
previewPath = "/"
title = "Stonkalicious"
description = "A dynamic NFT showcase for Robinhood Chain where each NFT evolves from naive to elite as the owner's allowlisted coin bag grows."
version = "1.0.0"
id = "artifacts/stonkalicious"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20779

[services.development]
run = "pnpm --filter @workspace/stonkalicious run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stonkalicious", "run", "build" ]
serve = "static"
publicDir = "artifacts/stonkalicious/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20779"
BASE_PATH = "/"