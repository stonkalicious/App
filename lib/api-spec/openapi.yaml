openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: warriors
    description: Live NFT metadata
  - name: identity
    description: Wallet ownership and X identity verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /warriors/{tokenId}:
    get:
      operationId: getWarriorMetadata
      tags: [warriors]
      summary: Get live metadata for an NFT
      description: Returns current metadata derived from the owner's qualifying public portfolio data. Stale data is explicitly marked.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: NFT metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarriorMetadata"
        "400":
          description: Invalid token ID
        "503":
          description: Data source is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /token/{tokenId}:
    get:
      operationId: getTokenMetadata
      tags: [warriors]
      summary: Get marketplace token metadata
      description: Contract-facing alias for the live NFT metadata route.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: NFT metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarriorMetadata"
        "404":
          description: Metadata is locked before launch
        "503":
          description: Data source is unavailable or not configured
  /collection:
    get:
      operationId: getCollectionMetadata
      tags: [warriors]
      summary: Get OpenSea collection metadata
      responses:
        "200":
          description: Collection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionMetadata"
        "404":
          description: Metadata is locked before launch
        "503":
          description: Metadata is unavailable or not configured
  /identity/challenge:
    post:
      operationId: createIdentityChallenge
      tags: [identity]
      summary: Create a wallet ownership challenge
      description: Returns a plain-message challenge. Signing it never approves a transaction or grants custody.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletChallengeRequest"
      responses:
        "200":
          description: Wallet challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletChallenge"
        "400":
          description: Invalid wallet address
        "429":
          description: Too many attempts
        "503":
          description: Identity verification is not configured
  /identity/x/start:
    post:
      operationId: startXVerification
      tags: [identity]
      summary: Verify wallet proof and start X OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSignatureRequest"
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRedirect"
        "400":
          description: Invalid or expired wallet proof
        "401":
          description: Wallet challenge required
        "429":
          description: Too many attempts
  /identity/x/callback:
    get:
      operationId: xVerificationCallback
      tags: [identity]
      summary: Complete X OAuth verification
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Redirects to the showcase with a generic verification result
        "400":
          description: Verification session missing
  /identity/status:
    get:
      operationId: getIdentityStatus
      tags: [identity]
      summary: Get the current verification state
      responses:
        "200":
          description: Verification state without raw X identity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityStatus"
  /identity/mint-authorization:
    post:
      operationId: consumeMintAuthorization
      tags: [identity]
      summary: Consume a one-use mint authorization
      description: Returns an EIP-712 authorization only after wallet proof and X verification. The response is single-use and short-lived.
      responses:
        "200":
          description: Signed mint authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintAuthorization"
        "409":
          description: Verification is required
        "410":
          description: Authorization was already used or expired
  /identity/reset:
    post:
      operationId: resetIdentityVerification
      tags: [identity]
      summary: Clear the local verification session
      responses:
        "204":
          description: Session cleared
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    WarriorAttribute:
      type: object
      properties:
        trait_type:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
      required: [trait_type, value]
    WarriorMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
          pattern: "^https?://"
        external_url:
          type: string
          pattern: "^https?://"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WarriorAttribute"
        properties:
          type: object
          properties:
            wallet:
              type: string
            epoch:
              type: string
            observedAt:
              type: string
              format: date-time
            stale:
              type: boolean
          required: [wallet, epoch, observedAt, stale]
      required: [name, description, image, external_url, attributes, properties]
    CollectionMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
          pattern: "^https?://"
        external_link:
          type: string
          pattern: "^https?://"
        seller_fee_basis_points:
          type: number
          minimum: 0
        fee_recipient:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
      required: [name, description, image, external_link, seller_fee_basis_points, fee_recipient]
    WalletChallengeRequest:
      type: object
      properties:
        wallet:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
      required: [wallet]
    WalletChallenge:
      type: object
      properties:
        challengeId:
          type: string
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [challengeId, message, expiresAt]
    WalletSignatureRequest:
      type: object
      properties:
        signature:
          type: string
      required: [signature]
    OAuthRedirect:
      type: object
      properties:
        status:
          type: string
          enum: [oauth_redirect]
        authorizeUrl:
          type: string
          pattern: "^https://"
      required: [status, authorizeUrl]
    IdentityStatus:
      type: object
      properties:
        status:
          type: string
          enum: [anonymous, unavailable, wallet_pending, oauth_pending, ready, failed]
        walletVerified:
          type: boolean
        xVerified:
          type: boolean
        mintAuthorizationAvailable:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        errorCode:
          type: string
      required: [status]
    MintAuthorization:
      type: object
      properties:
        wallet:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        quantity:
          type: integer
          enum: [1]
        profileHash:
          type: string
        challengeId:
          type: string
        nonce:
          type: string
        deadline:
          type: string
        signature:
          type: string
        mintPriceWei:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [wallet, quantity, profileHash, challengeId, nonce, deadline, signature, mintPriceWei, expiresAt]

